[package]
name = "nw-asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["assets", "oodle"]
# Asset catalogs, dependency references, and pak-backed content access.
# Disable to keep only the dependency-free asset identity types and the
# `AZ::Uuid` primitives, which need nothing beyond `uuid`.
assets = ["dep:nw-filesystem", "dep:nw-jobs", "dep:nw-pak"]
oodle = ["assets", "nw-pak/oodle"]

[dependencies]
nw-filesystem = { workspace = true, optional = true }
nw-jobs = { workspace = true, optional = true }
nw-pak = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true
