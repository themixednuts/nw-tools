[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/themixednuts/nw-tools"
publish = false

[workspace.lints.clippy]
correctness = { level = "deny" }
suspicious = { level = "deny" }
complexity = { level = "warn" }
perf = { level = "warn" }
style = { level = "warn" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0.102"
blake3 = "1.8.2"
bstr = "1.12.3"
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
heck = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
sha2 = "0.10.9"
stylua = { version = "=2.5.2", default-features = false, features = ["lua54"] }
thiserror = "2.0.18"
time = { version = "0.3.49", features = ["local-offset"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
arcstr = { version = "1.2.0", features = ["serde"] }
arrayvec = "0.7"
az-physics-assets = { version = "0.1.0", path = "crates/az-physics-assets" }
glam = { version = "0.32", features = ["serde"] }
bevy_math = { version = "0.19", default-features = false, features = ["std"] }
bevy_color = { version = "0.19", features = ["serialize"] }
bevy_transform = { version = "0.19", features = ["serialize"] }
crc32fast = "1.5.0"
flate2 = "1.1.9"
full_moon = { version = "=2.2.0", default-features = false, features = ["lua54"] }
hex = "0.4.3"
humansize = "2.1.3"
crossterm = "0.29.0"
ktx2 = "0.5.0"
lmbr-central-vshape = { version = "0.1.0", path = "crates/lmbr-central-vshape" }
memmap2 = "0.9.10"
memchr = "2.8.2"
petgraph = "0.8.3"
oxc_allocator = "0.135"
oxc_codegen = { version = "0.135", default-features = false }
oxc_parser = { version = "0.135", default-features = false }
crossbeam-channel = "0.5.15"
csv = "1"
oxc_span = "0.135"
prettyplease = "0.2"
proc-macro2 = "1"
quick-xml = { version = "0.40.1", features = ["serialize"] }
quote = "1"
ron = "0.12"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-image = { version = "11.0.5", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
signal-hook = "0.4.4"
syn = { version = "2", features = ["full", "parsing"] }
tempfile = "3"
tiff = "0.11"
uuid = { version = "1.23.3", features = ["serde"] }
weezl = "0.2"
vk2dfd = "0.1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
treesitter-types-go = "0.2"
treesitter-types-cpp = "0.2"
cry-chunk = { version = "0.1.0", path = "crates/cry-chunk" }
cry-animation = { version = "0.1.0", path = "crates/cry-animation" }
cry-audio = { version = "0.1.0", path = "crates/cry-audio" }
cry-character = { version = "0.1.0", path = "crates/cry-character" }
cry-mannequin = { version = "0.1.0", path = "crates/cry-mannequin" }
cry-particles = { version = "0.1.0", path = "crates/cry-particles" }
cry-xml = { version = "0.1.0", path = "crates/cry-xml" }
nw-asset = { version = "0.1.0", path = "crates/nw-asset", default-features = false }
nw-asset-graph = { version = "0.1.0", path = "crates/nw-asset-graph" }
nw-artifact = { version = "0.1.0", path = "crates/nw-artifact" }
nw-datasheet = { version = "0.1.0", path = "crates/nw-datasheet" }
nw-dds = { version = "0.1.0", path = "crates/nw-dds" }
nw-filesystem = { version = "0.1.0", path = "crates/nw-filesystem" }
nw-locator = { version = "0.1.0", path = "crates/nw-locator" }
nw-lua = { version = "0.1.0", path = "crates/nw-lua" }
nw-model = { version = "0.1.0", path = "crates/nw-model" }
nv-cloth-assets = { version = "0.1.0", path = "crates/nv-cloth-assets" }
nw-jobs = { version = "0.1.0", path = "crates/nw-jobs" }
nw-localization = { version = "0.1.0", path = "crates/nw-localization" }
nw-objectstream = { version = "0.1.0", path = "crates/nw-objectstream", default-features = false }
nw-pak = { version = "0.1.0", path = "crates/nw-pak", default-features = false }
nw-resources = { version = "0.1.0", path = "crates/nw-resources" }
nw-reflected-types = { version = "0.1.0", path = "crates/nw-reflected-types" }
nw-rnr = { version = "0.1.0", path = "crates/nw-rnr" }
nw-scene = { version = "0.1.0", path = "crates/nw-scene" }
nw-terrain = { version = "0.1.0", path = "crates/nw-terrain" }
nw-vegetation = { version = "0.1.0", path = "crates/nw-vegetation" }
nw-serialize-codegen = { version = "0.1.0", path = "crates/nw-serialize-codegen" }
