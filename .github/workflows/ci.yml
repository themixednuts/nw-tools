name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  AZ_RS_REV: f787c9eddc11a12458f50f1114d7c600e636a104

jobs:
  fmt:
    name: fmt
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.0
        with:
          path: nw-tools

      - name: checkout az-rs
        uses: actions/checkout@v7.0.0
        with:
          repository: TheMixys/az-rs
          ref: ${{ env.AZ_RS_REV }}
          path: az-rs
          ssh-key: ${{ secrets.AZ_RS_DEPLOY_KEY }}
          persist-credentials: false

      - name: rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: fmt
        working-directory: nw-tools
        run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: fmt
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.0
        with:
          path: nw-tools

      - name: checkout az-rs
        uses: actions/checkout@v7.0.0
        with:
          repository: TheMixys/az-rs
          ref: ${{ env.AZ_RS_REV }}
          path: az-rs
          ssh-key: ${{ secrets.AZ_RS_DEPLOY_KEY }}
          persist-credentials: false

      - name: rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: clippy
          workspaces: nw-tools -> target

      - name: clippy
        working-directory: nw-tools
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: clippy
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.0
        with:
          path: nw-tools

      - name: checkout az-rs
        uses: actions/checkout@v7.0.0
        with:
          repository: TheMixys/az-rs
          ref: ${{ env.AZ_RS_REV }}
          path: az-rs
          ssh-key: ${{ secrets.AZ_RS_DEPLOY_KEY }}
          persist-credentials: false

      - name: rust
        run: rustup toolchain install stable --profile minimal

      - name: cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: test
          workspaces: nw-tools -> target

      - name: test
        working-directory: nw-tools
        run: cargo test --workspace --locked
